name: Build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check key outputs
        run: |
          test -f _site/index.html
          test -f _site/rss.xml
          test -f _site/sitemap.xml
          ls _site/articles
